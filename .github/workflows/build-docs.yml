name: Setup Docs Site

on:
  workflow_dispatch:
  release:
    types: [released]

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: peaceiris/actions-mdbook@v2
      - name: Generate docs
        run: bash ./build_docs.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs_src/book

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
